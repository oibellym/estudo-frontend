<!DOCTYPE html>

<html lang="pt-br">

    <head>

        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">

        <title>LocomotIsas</title>

    </head>

    <body>

        <h1 id="title"> Locomotivas </h1>

        <div id="grid">

            <div class="produto"> 

                <h2 class="nome-produto"> Carro: <span class="preco"> R$ 1999 </span> </h2>

                <p class="desc"> Carro modelo <span class="destaque"> 2045 </span> com <span class="destaque"> 200km </span> rodados. </p>
                <img class="produtos-img" src="/0216-imagens/img/carro-654x260.jpg" alt="carro">
                <button class="btn"> Comprar </button>

            </div>

            <div class="produto"> 

                <h2 class="nome-produto"> Bicicleta: <span class="preco"> R$ 199 </span> </h2>

                <p class="desc"> Bicicleta modelo <span class="destaque"> 2055 </span> com <span class="destaque"> 2km </span> rodados. </p>
                <img class="produtos-img" src="/0216-imagens/img/bicicleta-1200-800.jpg" alt="bicicleta" width="300px">
                <button class="btn"> Comprar </button>

            </div>

            <div class="produto"> 

                <h2 class="nome-produto"> Motocicleta: <span class="preco"> R$ 999 </span> </h2>

                <p class="desc"> Motocicleta modelo <span class="destaque"> 265 </span> com <span class="destaque"> 20km </span> rodados. </p>
                <img class="produtos-img" src="/0216-imagens/img/moto.jpg" alt="moto" width="300px">
                <button class="btn"> Comprar </button>

            </div>

            <div class="produto"> 

                <h2 class="nome-produto"> Jetski: <span class="preco"> R$ 199 </span> </h2>

                <p class="desc"> Jetski modelo <span class="destaque"> 2075 </span> com <span class="destaque"> 15km </span> rodados. </p>
                <img class="produtos-img" src="/0216-imagens/img/jetski.jpg" alt="jetski" width="300px">
                <button class="btn"> Comprar </button>

            </div>

        </div>


    </body>

</html>
